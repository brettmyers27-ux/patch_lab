name: Version policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version-sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify every commit advances PatchLab exactly once
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          python scripts/verify_version_increment.py --range "$base" "${{ github.sha }}"
