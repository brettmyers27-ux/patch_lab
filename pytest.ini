[pytest]
testpaths = tests
markers =
    realserum: real headless integration against an installed Serum plug-in.

# Real plug-in hosting (JUCE/CoreAudio via DawDreamer and pedalboard) cannot
# share a process with PySide6's QApplication event loop: instantiating a Serum
# plug-in first makes a later `QEventLoop.exec()` segfault. pytest-randomly also
# means test order cannot be relied on to keep them apart.
#
# So the real-Serum integration tests are deselected from the default unit run
# and executed as their own pass:
#
#     pytest tests/                       # unit + regression suite
#     pytest tests/ -m realserum          # real headless Serum integration
#
# Both must pass before release; they are reported separately.
addopts = -m "not realserum"
